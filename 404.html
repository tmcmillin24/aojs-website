<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Page Not Found | All Over Janitorial Services</title>

  <meta
    name="robots"
    content="noindex, follow"
  >

  <meta
    name="theme-color"
    content="#0b4fa3"
  >

  <link
    rel="icon"
    type="image/png"
    href="/images/favicon.png"
  >

  <link
    rel="apple-touch-icon"
    href="/images/favicon.png"
  >

  <link
    rel="stylesheet"
    href="/css/styles.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f8fb;
      color: #17365d;
    }

    .not-found-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 22px;
      background:
        radial-gradient(
          circle at top right,
          rgba(0, 169, 79, 0.10),
          transparent 32%
        ),
        linear-gradient(
          145deg,
          #f8fafc 0%,
          #eef4fb 100%
        );
    }

    .not-found-card {
      width: min(720px, 100%);
      padding: 54px 42px;
      border: 1px solid #dfe7ef;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 24px 60px rgba(15, 42, 67, 0.12);
      text-align: center;
    }

    .not-found-logo {
      width: min(230px, 72%);
      height: auto;
      margin: 0 auto 24px;
      display: block;
    }

    .not-found-code {
      margin: 0 0 8px;
      color: #00a94f;
      font-size: clamp(4.5rem, 18vw, 8.5rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 0.9;
    }

    .not-found-card h1 {
      margin: 0 0 16px;
      color: #153b73;
      font-size: clamp(2rem, 6vw, 3.4rem);
      line-height: 1.05;
      text-transform: uppercase;
    }

    .not-found-card p {
      max-width: 560px;
      margin: 0 auto 28px;
      color: #5c6773;
      font-size: 1.05rem;
      line-height: 1.75;
    }

    .not-found-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .not-found-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 13px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      transition:
        transform 0.2s ease,
        background-color 0.2s ease,
        color 0.2s ease;
    }

    .not-found-button-primary {
      background: #0b4fa3;
      color: #ffffff;
    }

    .not-found-button-primary:hover {
      background: #083d7e;
      transform: translateY(-2px);
    }

    .not-found-button-secondary {
      border: 1px solid #cfd9e4;
      background: #ffffff;
      color: #153b73;
    }

    .not-found-button-secondary:hover {
      background: #f5f8fc;
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .not-found-card {
        padding: 40px 22px;
        border-radius: 18px;
      }

      .not-found-actions {
        flex-direction: column;
      }

      .not-found-button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .not-found-button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="not-found-page">

    <section
      class="not-found-card"
      aria-labelledby="not-found-title"
    >

      <img
        src="/images/social-logo.png"
        alt="All Over Janitorial Services"
        class="not-found-logo"
      >

      <div
        class="not-found-code"
        aria-hidden="true"
      >
        404
      </div>

      <h1 id="not-found-title">
        Page Not Found
      </h1>

      <p>
        Sorry, the page you're looking for may have moved,
        been renamed, or no longer exists. You can return
        to the homepage or contact our team for help.
      </p>

      <div class="not-found-actions">

        <a
          href="/"
          class="not-found-button not-found-button-primary"
        >
          Return Home
        </a>

        <a
          href="/contact.html"
          class="not-found-button not-found-button-secondary"
        >
          Contact Us
        </a>

      </div>

    </section>

  </main>

</body>

</html>
